<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Sheet Link Tester (Standalone)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

function LiveLinkTester() {
  const [url, setUrl] = useState('');
  const [status, setStatus] = useState('idle');
  const [errorMsg, setErrorMsg] = useState('');
  const [rows, setRows] = useState([]);

  const testFetch = async () => {
    setStatus('loading');
    setErrorMsg('');
    setRows([]);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const text = await res.text();
      const parsed = Papa.parse(text, { header: true });
      setRows(parsed.data.filter(r => Object.values(r).some(v => v)).slice(0, 5));
      setStatus('success');
    } catch (e) {
      setErrorMsg(e.message || String(e));
      setStatus('error');
    }
  };

  return (
    <div style={{ padding: 20, maxWidth: 600, margin: '0 auto' }}>
      <h1 style={{ fontSize: 20, fontWeight: 700 }}>Live Sheet Link Tester</h1>
      <p style={{ fontSize: 13, color: '#666', marginTop: 4 }}>
        Running as a standalone hosted page. Paste your Google Sheet's published CSV URL
        (File → Share → Publish to web → CSV), then tap Test.
      </p>
      <input
        value={url}
        onChange={e => setUrl(e.target.value)}
        placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv"
        style={{ width: '100%', padding: 10, marginTop: 12, borderRadius: 8, border: '1px solid #ccc', fontSize: 14, boxSizing: 'border-box' }}
      />
      <button
        onClick={testFetch}
        disabled={!url || status === 'loading'}
        style={{ marginTop: 10, padding: '10px 16px', borderRadius: 8, border: 'none', backgroundColor: '#222', color: '#fff', fontWeight: 600 }}
      >
        {status === 'loading' ? 'Testing…' : 'Test Fetch'}
      </button>

      {status === 'error' && (
        <div style={{ marginTop: 16, padding: 12, backgroundColor: '#fee', borderRadius: 8, color: '#900' }}>
          <strong>Fetch failed:</strong> {errorMsg}
        </div>
      )}

      {status === 'success' && (
        <div style={{ marginTop: 16 }}>
          <p style={{ color: '#070', fontWeight: 600 }}>✓ Fetch succeeded — {rows.length} sample rows parsed</p>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', marginTop: 10, fontSize: 12, borderCollapse: 'collapse' }}>
              <thead>
                <tr>
                  {rows[0] && Object.keys(rows[0]).slice(0, 5).map(k => (
                    <th key={k} style={{ textAlign: 'left', borderBottom: '1px solid #ddd', padding: 4, whiteSpace: 'nowrap' }}>{k}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i}>
                    {Object.keys(r).slice(0, 5).map(k => (
                      <td key={k} style={{ borderBottom: '1px solid #eee', padding: 4 }}>{String(r[k]).slice(0, 30)}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<LiveLinkTester />);
</script>
</body>
</html>
